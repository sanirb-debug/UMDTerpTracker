<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
         other than zero on a notched iPhone. Without it the CSS below is inert. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Read your UMD transcript, see your GPA, and work out what grades you need. Everything runs in your browser."
    />
    <title>TerpTracker — UMD GPA and degree audit</title>

    <link rel="icon" href="/UMDTerpTracker/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/UMDTerpTracker/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <!--
      Absolute URLs, deliberately. Vite rewrites href/src for the base path but
      leaves `content` alone, and the scrapers that read these tags do not
      resolve relative URLs anyway — a relative og:image is simply no og:image.
      This is how the link looks when somebody drops it in a group chat, which
      is the only way this app spreads.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TerpTracker" />
    <meta property="og:title" content="TerpTracker — UMD GPA and degree audit" />
    <meta
      property="og:description"
      content="Read your UMD transcript, see your GPA, and work out what grades you need. Runs entirely in your browser — your transcript is never uploaded."
    />
    <meta property="og:url" content="https://sanirb-debug.github.io/UMDTerpTracker/" />
    <meta
      property="og:image"
      content="https://sanirb-debug.github.io/UMDTerpTracker/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TerpTracker: your UMD transcript, your GPA, and what you need next. Runs in your browser, nothing is uploaded."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="/UMDTerpTracker/assets/index-BIjknidK.js"></script>
    <link rel="stylesheet" crossorigin href="/UMDTerpTracker/assets/index-BQkVgSQ5.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
